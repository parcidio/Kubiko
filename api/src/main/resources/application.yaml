spring:
  application:
    name: beeznoo-api
  datasource:
    # Neon: host *pooled* e DB_SSLMODE=require. Em local fica "prefer" (Postgres do docker-compose sem SSL)
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # O Neon fecha ligações inativas: ligações de vida curta e poucas (o pooler do Neon faz o resto)
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      idle-timeout: 60000
      max-lifetime: 240000
      keepalive-time: 120000
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  servlet:
    multipart:
      # KYC: até 5 documentos de 5 MB (o limite por ficheiro também é validado no KycService)
      max-file-size: 5MB
      max-request-size: 26MB
  data:
    web:
      pageable:
        # páginas de 2.000 elementos eram aceites
        max-page-size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
            # Atrás do proxy do Render o pedido chega em HTTP: em produção fixar o URL https registado na Google Cloud
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}

server:
  # O Render define PORT; em local 8080
  port: ${PORT:8080}
  # Termina os pedidos em curso antes de parar (deploys sem cortar pedidos)
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false
  servlet:
    session:
      # Só o fluxo OAuth2 usa sessão
      timeout: 10m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

logging:
  pattern:
    # X-Request-Id em cada linha (RequestIdFilter)
    level: "%5p [%X{requestId:-}]"

# Swagger desligado por omissão (OWASP A02); ligar em desenvolvimento com API_DOCS_ENABLED=true
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # Não há RabbitMQ no Render e nenhum código o usa ainda: não deixar o health check falhar por isso
    rabbit:
      enabled: ${RABBITMQ_HEALTH_ENABLED:false}

jwt:
  # Sem valor por omissão: a API não arranca sem JWT_SECRET (≥ 32 bytes). Gera com: openssl rand -base64 64
  secret: ${JWT_SECRET:}
  # Curto de propósito: limita tokens roubados e mudanças de papel (o refresh renova)
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}

ombala:
  api-url: https://api.useombala.ao/v1
  token: ${OMBALA_TOKEN}
  sender: ${OMBALA_SENDER}
  otp-expiration-minutes: ${OMBALA_OTP_EXPIRATION_MINUTES:10}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  payments:
    # simulated (MVP) | emis (futuro) — ver claude/decisoes-produto.md
    provider: ${PAYMENTS_PROVIDER:simulated}
    service-fee-rate: ${PAYMENTS_SERVICE_FEE_RATE:0.08}
    reference-ttl: ${PAYMENTS_REFERENCE_TTL:24h}
    simulated:
      entity: ${PAYMENTS_SIMULATED_ENTITY:00000}
      # true só em dev/demo: "Já paguei" confirma logo. Em produção fica false (admin valida).
      auto-confirm: ${PAYMENTS_AUTO_CONFIRM:false}
  storage:
    # Backblaze B2 (API S3), bucket PRIVADO. Obrigatório: a API não arranca sem isto. Ver claude/decisoes-produto.md
    endpoint: ${B2_ENDPOINT:}
    region: ${B2_REGION:}
    access-key: ${B2_ACCESS_KEY:}
    secret-key: ${B2_SECRET_KEY:}
    bucket: ${B2_BUCKET:}
    signed-url-ttl: ${APP_STORAGE_SIGNED_URL_TTL:5m}
  notifications:
    email:
      # false: notificações só na app (email_status SKIPPED). true exige RESEND_API_KEY e domínio verificado no Resend.
      enabled: ${NOTIFICATIONS_EMAIL_ENABLED:false}
      api-url: ${RESEND_API_URL:https://api.resend.com}
      api-key: ${RESEND_API_KEY:}
      from: ${RESEND_FROM:Beeznoo <noreply@beeznoo.ao>}
  security:
    rate-limits-enabled: ${RATE_LIMITS_ENABLED:true}
    # memory (uma instância) | database (várias instâncias — contadores no Postgres)
    rate-limit-store: ${RATE_LIMIT_STORE:memory}
    # 2FA por SMS no login de contas ADMIN
    admin-mfa-enabled: ${ADMIN_MFA_ENABLED:true}
    # Secure nos cookies (refresh e sessão OAuth2); false só em http://localhost
    cookie-secure: ${SESSION_COOKIE_SECURE:true}
    # Strict com o proxy do Next (mesma origem); None quando o front chama a API noutro domínio (staging)
    cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
    # Origens do frontend que podem chamar a API pelo browser (ex.: https://staging.beeznoo.ao). Vazio = sem CORS
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    # nº de proxies à frente da API que acrescentam ao X-Forwarded-For (0 em local; Vercel + Render = 2)
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:0}
    max-json-bytes: 1048576
