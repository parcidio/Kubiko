spring:
  application:
    name: beeznoo-api 
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: ture
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    password: ${RABBITMQ_PASSWORD}

  server:
    port: 8080

  management:
    endpoints:
      web:
        exposure:
          include: health, info
