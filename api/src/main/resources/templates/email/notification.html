<!DOCTYPE html>
<html lang="pt-PT" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Beeznoo</title>
</head>
<!-- Identidade Verde (docs/DESIGN_SYSTEM.md): areia, verde, um só botão âmbar com texto verde. Estilos inline para clientes de email. -->
<body style="margin:0;padding:0;background:#FAF6EF;font-family:'DM Sans',Arial,Helvetica,sans-serif;color:#2C3A33;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FAF6EF;">
    <tr>
        <td align="center" style="padding:24px 16px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:560px;background:#FFFFFF;border:1px solid #E1E5DB;border-radius:16px;">
                <tr>
                    <td style="padding:24px 24px 8px 24px;">
                        <span style="font-family:'Bricolage Grotesque',Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;color:#0E2A1F;">Beeznoo</span>
                    </td>
                </tr>
                <tr>
                    <td style="padding:8px 24px 0 24px;">
                        <h1 th:text="${title}"
                            style="margin:0 0 16px 0;font-family:'Bricolage Grotesque',Arial,Helvetica,sans-serif;font-size:22px;line-height:1.3;color:#0E2A1F;">
                            Título</h1>
                        <p th:if="${firstName}" th:text="|Olá, ${firstName}.|"
                           style="margin:0 0 12px 0;font-size:16px;line-height:1.5;">Olá.</p>
                        <p th:each="p : ${paragraphs}" th:text="${p}"
                           style="margin:0 0 12px 0;font-size:16px;line-height:1.5;">Texto</p>
                    </td>
                </tr>
                <tr th:if="${ctaUrl}">
                    <td style="padding:12px 24px 24px 24px;">
                        <a th:href="${ctaUrl}" th:text="${ctaLabel}"
                           style="display:inline-block;background:#F0A22E;color:#0E2A1F;font-weight:700;font-size:16px;text-decoration:none;padding:14px 24px;border-radius:12px;">
                            Abrir a Beeznoo</a>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 24px 24px 24px;border-top:1px solid #E1E5DB;font-size:13px;line-height:1.5;color:#2C3A33;">
                        Recebeste este email porque tens conta na Beeznoo. Por que comprar quando podes alugar?
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
