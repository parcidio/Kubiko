# Só para testes: valores fictícios para a API arrancar. Nenhum teste fala com o B2 (usam MockStorageService).
app:
  kyc:
    required: true
  # sem pausas entre mensagens nos testes
  messages:
    whatsapp-min-delay: 0s
    whatsapp-max-delay: 0s
    other-delay: 0s
  storage:
    endpoint: http://localhost:9
    region: us-east-005
    access-key: test
    secret-key: test
    bucket: test-bucket
    signed-url-ttl: 5m
jwt:
  secret: test-only-jwt-secret-with-more-than-32-bytes-0123456789
springdoc:
  api-docs:
    enabled: true

# O SMS é simulado (@MockitoBean OmbalaSmsService); com token definido conta como canal de OTP disponível
ombala:
  token: test-token
