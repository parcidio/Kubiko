# Workflow de CI - build e testes da API Beeznoo com Maven
# Corre em todo push/PR para main. O pom.xml vive em api/, por isso
# usamos working-directory + --file explicito.

name: Java CI with Maven

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./api

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: api/pom.xml

      - name: Build and test with Maven
        run: mvn -B verify --file pom.xml
