<style>
body{margin:0;background:#FAF6EF}
a{color:#9A5C0E}a:hover{color:#7A4A0B}
*{box-sizing:border-box}
.app{font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;color:#2C3A33}
.sg{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;letter-spacing:-0.02em}
:focus-visible{outline:3px solid #F0A22E;outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;font:700 16px 'DM Sans',sans-serif;text-decoration:none;border:0;cursor:pointer;transition:transform .2s cubic-bezier(.2,.8,.2,1),background .2s}
.btn:active{transform:scale(.97)}
.btn-p{background:#F0A22E;color:#0E2A1F}.btn-p:hover{background:#E08F17;color:#0E2A1F}
.btn-s{background:#FFFFFF;color:#0E2A1F;border:1.5px solid #B9C2B5}.btn-s:hover{border-color:#0E2A1F;color:#0E2A1F}
.lbl{display:block;font-size:14px;font-weight:500;color:#0E2A1F;margin-bottom:6px}
.inp{width:100%;min-height:52px;padding:0 14px;border:1.5px solid #B9C2B5;border-radius:12px;background:#FFFFFF;font:500 17px 'DM Sans',sans-serif;color:#0E2A1F;letter-spacing:.04em}
.inp:focus{outline:none;border-color:#1F5C42;box-shadow:0 0 0 3px #E3F0E9}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:5px;background:#F3E9D8;border-radius:14px}
.seg button{min-height:44px;border:0;border-radius:10px;background:transparent;font:500 15px 'DM Sans',sans-serif;color:#0E2A1F;cursor:pointer;transition:background .25s,color .25s}
.seg button.on{background:#0E2A1F;color:#FAF6EF}
.otp{width:46px;height:56px;border:1.5px solid #B9C2B5;border-radius:12px;background:#FFFFFF;text-align:center;font:700 24px 'Bricolage Grotesque',sans-serif;color:#0E2A1F}
.otp:focus{outline:none;border-color:#1F5C42;box-shadow:0 0 0 3px #E3F0E9}
.hx{position:absolute;width:var(--s);height:calc(var(--s) * 1.1547);transform-style:preserve-3d;animation:spin var(--d) linear infinite}
.hx i{position:absolute;inset:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hx i:nth-child(2){transform:translateZ(-3px);filter:brightness(.8)}.hx i:nth-child(3){transform:translateZ(-6px);filter:brightness(.68)}.hx i:nth-child(4){transform:translateZ(-9px);filter:brightness(.9)}
@keyframes spin{from{transform:rotateX(18deg) rotateY(0)}to{transform:rotateX(18deg) rotateY(360deg)}}
.hx-a i{background:#F0A22E}.hx-b i{background:#8FC0A8}
.sheet{animation:up .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.swap{animation:swap .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes swap{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<main class="app" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E2A1F; display: flex; flex-direction: column">
  <div style="position: relative; height: 300px; padding: 56px 24px 0; perspective: 900px; overflow: hidden">
    <div class="hx hx-a" style="--s: 74px; --d: 12s; right: 34px; top: 54px"><i></i><i></i><i></i><i></i></div>
    <div class="hx hx-b" style="--s: 34px; --d: 8s; right: 120px; top: 150px"><i></i><i></i><i></i><i></i></div>
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="34" height="34" sc-camel-view-box="0 0 512 512" aria-hidden="true"><polygon points="256,34 450,147 450,371 256,478 62,371 62,147" fill="#F0A22E"></polygon><rect x="62" y="161" width="388" height="42" fill="#0E2A1F"></rect><rect x="62" y="238" width="388" height="42" fill="#0E2A1F"></rect><rect x="62" y="315" width="388" height="42" fill="#0E2A1F"></rect></svg>
      <span class="sg" style="font-size: 22px; font-weight: 800; color: #FAF6EF">beeznoo</span>
    </div>
    <h1 class="sg" style="margin: 44px 0 0; font-size: 34px; line-height: 1.05; color: #FFFFFF; max-width: 260px">{{title}}</h1>
    <p style="margin: 10px 0 0; color: #E3F0E9; font-size: 15px; max-width: 280px">{{sub}}</p>
  </div>

  <div class="sheet" style="flex: 1; background: #FAF6EF; border-radius: 24px 24px 0 0; padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 20px">
    <sc-if value="{{isPhone}}" hint-placeholder-val="{{ true }}">
      <div class="swap" style="display: flex; flex-direction: column; gap: 20px; flex: 1">
        <div>
          <label class="lbl" for="tel">Número de telemóvel</label>
          <div style="display: flex; gap: 8px">
            <span style="flex: none; display: flex; align-items: center; padding: 0 14px; min-height: 52px; border-radius: 12px; background: #F3E9D8; font-weight: 700; color: #0E2A1F">+244</span>
            <input class="inp" id="tel" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="923 000 000" value="923 451 481">
          </div>
          <p style="margin: 8px 0 0; font-size: 13px; color: #5E6B64; display: flex; gap: 6px; align-items: center"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="#1F5C42" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>Enviamos-te um código de 6 dígitos por WhatsApp.</p>
        </div>
        <div>
          <span class="lbl" id="l-tipo">Vais usar a Beeznoo como</span>
          <div class="seg" role="group" aria-labelledby="l-tipo">
            <button type="button" class="{{cP}}" aria-pressed="{{pP}}" sc-camel-on-click="{{part}}">Particular</button>
            <button type="button" class="{{cE}}" aria-pressed="{{pE}}" sc-camel-on-click="{{emp}}">Empresa</button>
          </div>
        </div>
        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
          <button type="button" class="btn btn-p" style="width: 100%" sc-camel-on-click="{{toCode}}">Receber código</button>
          <button type="button" class="btn btn-s" style="width: 100%">Continuar com Google</button>
          <p style="margin: 4px 0 0; font-size: 13px; color: #5E6B64; text-align: center">Ao continuar aceitas os <a href="#">Termos</a> e a <a href="#">Política de Privacidade</a>.</p>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{isCode}}" hint-placeholder-val="{{ false }}">
      <div class="swap" style="display: flex; flex-direction: column; gap: 20px; flex: 1">
        <div>
          <span class="lbl" id="l-cod">Código de 6 dígitos</span>
          <div role="group" aria-labelledby="l-cod" style="display: flex; justify-content: space-between">
            <input class="otp" aria-label="Dígito 1" inputmode="numeric" maxlength="1" value="4">
            <input class="otp" aria-label="Dígito 2" inputmode="numeric" maxlength="1" value="8">
            <input class="otp" aria-label="Dígito 3" inputmode="numeric" maxlength="1" value="2">
            <input class="otp" aria-label="Dígito 4" inputmode="numeric" maxlength="1">
            <input class="otp" aria-label="Dígito 5" inputmode="numeric" maxlength="1">
            <input class="otp" aria-label="Dígito 6" inputmode="numeric" maxlength="1">
          </div>
          <p style="margin: 10px 0 0; font-size: 14px; color: #2C3A33">Enviado por WhatsApp para <strong>+244 923 ••• 481</strong>.</p>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: 12px; background: #FDF0DC; color: #7A4A0B; font-size: 14px">
          <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#7A4A0B" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>Podes pedir outro código em 0:42
        </div>
        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
          <button type="button" class="btn btn-p" style="width: 100%">Confirmar</button>
          <button type="button" class="btn btn-s" style="width: 100%" sc-camel-on-click="{{toPhone}}">Mudar número</button>
        </div>
      </div>
    </sc-if>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { step: 'phone', tipo: 'particular' }; }
  renderVals() {
    const ph = this.state.step === 'phone';
    const t = this.state.tipo;
    return {
      isPhone: ph, isCode: !ph,
      title: ph ? 'Entra ou cria a tua conta' : 'Confirma o teu número',
      sub: ph ? 'Só com o teu número. Sem palavras-passe para decorar.' : 'Abre o WhatsApp e escreve aqui o código que te enviámos.',
      cP: t === 'particular' ? 'on' : '', cE: t === 'empresa' ? 'on' : '',
      pP: t === 'particular', pE: t === 'empresa',
      part: () => this.setState({ tipo: 'particular' }),
      emp: () => this.setState({ tipo: 'empresa' }),
      toCode: () => this.setState({ step: 'code' }),
      toPhone: () => this.setState({ step: 'phone' })
    };
  }
}
</script>
