<style>
body{margin:0;background:#FAF6EF}
a{color:#9A5C0E}a:hover{color:#7A4A0B}
*{box-sizing:border-box}
.app{font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;color:#2C3A33}
.sg{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;letter-spacing:-0.02em;color:#0E2A1F}
:focus-visible{outline:3px solid #F0A22E;outline-offset:2px}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid #E1E5DB;background:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid #B9C2B5;background:#FFFFFF;font:500 15px 'DM Sans',sans-serif;color:#0E2A1F;cursor:pointer;transition:background .25s,color .25s,border-color .25s}
.chip.on{background:#0E2A1F;border-color:#0E2A1F;color:#FAF6EF}
.chip.on svg{stroke:#F0A22E}
.fchip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;background:#F3E9D8;color:#0E2A1F;font-size:13px;font-weight:500}
.ecard{background:#FFFFFF;border:1px solid #E1E5DB;border-radius:16px;padding:8px;text-decoration:none;display:block;color:inherit;animation:in .5s cubic-bezier(.2,.8,.2,1) both;transition:border-color .25s}
.ecard:hover{border-color:#8FC0A8}
.ecard:nth-child(2){animation-delay:.05s}.ecard:nth-child(3){animation-delay:.1s}.ecard:nth-child(4){animation-delay:.15s}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ph{aspect-ratio:4/3;border-radius:12px;background:#F3E9D8;display:flex;align-items:center;justify-content:center;position:relative}
.price{position:absolute;left:8px;bottom:8px;padding:4px 9px;border-radius:999px;background:#FFFFFF;box-shadow:0 6px 16px -6px rgba(14,42,31,.35);font:700 13px 'Bricolage Grotesque',sans-serif;color:#0E2A1F}
.bv{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:#1F5C42}
.feat{position:relative;border-radius:24px;background:#0E2A1F;color:#FAF6EF;padding:18px;overflow:hidden;perspective:800px}
.hx{position:absolute;width:var(--s);height:calc(var(--s) * 1.1547);transform-style:preserve-3d;transform:rotateX(18deg) rotateY(-30deg)}
.hx i{position:absolute;inset:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#F0A22E}
.hx i:nth-child(2){transform:translateZ(-4px);filter:brightness(.8)}.hx i:nth-child(3){transform:translateZ(-8px);filter:brightness(.66)}
.bnav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#FFFFFF;border-top:1px solid #E1E5DB;padding:6px 8px 14px}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;text-decoration:none;color:#5E6B64;font-size:12px;font-weight:500;border-radius:12px}
.bnav a.on{color:#0E2A1F;font-weight:700}
.bnav a.on .pill{background:#0E2A1F}.bnav a.on .pill svg{stroke:#F0A22E}
.pill{width:52px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:background .25s}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<main class="app" style="width: 390px; height: 844px; overflow: hidden; background: #FAF6EF; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
    <div style="display: flex; align-items: center; gap: 8px">
      <svg width="28" height="28" sc-camel-view-box="0 0 512 512" aria-hidden="true"><polygon points="256,34 450,147 450,371 256,478 62,371 62,147" fill="#F0A22E"></polygon><rect x="62" y="161" width="388" height="42" fill="#0E2A1F"></rect><rect x="62" y="238" width="388" height="42" fill="#0E2A1F"></rect><rect x="62" y="315" width="388" height="42" fill="#0E2A1F"></rect></svg>
      <span class="sg" style="font-size: 20px; font-weight: 800">beeznoo</span>
    </div>
    <button type="button" class="ib" aria-label="Notificações, 2 por ler"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#0E2A1F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><span style="position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: #F0A22E; border: 2px solid #FFFFFF"></span></button>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 0 16px 20px">
    <h1 class="sg" style="font-size: 26px; line-height: 1.1; margin: 8px 0 14px">O que precisas de alugar?</h1>
    <div style="display: flex; gap: 8px">
      <label style="flex: 1; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 14px; border: 1.5px solid #B9C2B5; border-radius: 12px; background: #FFFFFF">
        <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#5E6B64" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Pesquisar equipamento</span>
        <input type="search" placeholder="Câmara, coluna, projetor…" style="border: 0; outline: none; flex: 1; font: 400 15px 'DM Sans', sans-serif; color: #0E2A1F; background: transparent; min-width: 0">
      </label>
      <button type="button" class="ib" aria-label="Filtros" style="width: 48px; height: 48px"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#0E2A1F" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg></button>
    </div>

    <div role="tablist" aria-label="Categorias" style="display: flex; gap: 8px; overflow-x: auto; margin: 14px -16px 0; padding: 0 16px 4px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
        <button type="button" role="tab" class="chip {{c.cls}}" aria-selected="{{c.sel}}" sc-camel-on-click="{{c.pick}}"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>{{c.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; gap: 8px; margin-top: 10px">
      <span class="fchip"><svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="#0E2A1F" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>23 a 25 out</span>
      <span class="fchip"><svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="#0E2A1F" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M20 10c0 5-5.5 10.2-7.4 11.8a1 1 0 0 1-1.2 0C9.5 20.2 4 15 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>Talatona</span>
    </div>

    <div class="feat" style="margin-top: 18px">
      <div class="hx" style="--s: 66px; right: 18px; top: 16px"><i></i><i></i><i></i></div>
      <div style="font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #8FC0A8">Como funciona</div>
      <div class="sg" style="font-size: 20px; color: #FFFFFF; margin-top: 6px; max-width: 240px; line-height: 1.15">Pedes, o dono aceita, pagas só na entrega.</div>
      <a href="#" style="display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; color: #E3F0E9; font-size: 14px; font-weight: 700; min-height: 32px">Ver os 4 passos<svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline; margin: 22px 0 10px">
      <h2 class="sg" style="font-size: 19px; margin: 0">{{heading}}</h2>
      <span style="font-size: 13px; color: #5E6B64">{{count}}</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px" key="{{cat}}">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
        <a href="App-Detalhe.dc.html" class="ecard">
          <div class="ph"><svg width="44" height="44" sc-camel-view-box="0 0 24 24" fill="none" stroke="#B76E12" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg><span class="price">{{it.price}}<span style="font: 400 11px 'DM Sans'; color: #5E6B64">/dia</span></span></div>
          <div style="padding: 8px 4px 4px">
            <div class="sg" style="font-size: 15px; line-height: 1.2">{{it.name}}</div>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: 4px; font-size: 12px; color: #5E6B64">{{it.area}}<span class="bv"><svg width="12" height="12" sc-camel-view-box="0 0 24 24" fill="none" stroke="#1F5C42" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Verificado</span></div>
          </div>
        </a>
      </sc-for>
    </div>
  </div>

  <nav class="bnav" aria-label="Principal">
    <a href="#" class="on" aria-current="page"><span class="pill"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#5E6B64" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></span>Explorar</a>
    <a href="App-Reserva.dc.html"><span class="pill"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#5E6B64" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"></path><path d="M13 5v2M13 17v2M13 11v2"></path></svg></span>Reservas</a>

    <a href="#"><span class="pill"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#5E6B64" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg></span>Conta</a>
