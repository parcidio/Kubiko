# Beeznoo numa VPS: tudo no mesmo servidor (ver docs/DEPLOY_VPS.md e o PDF "Beeznoo — guia da plataforma").
#   caddy    → HTTPS automático (Let's Encrypt) para o site e para o armazenamento
#   web      → Next.js (o browser só fala com ele; /api/v1 vai para a API pela rede interna)
#   api      → Spring Boot
#   postgres → base de dados (só na rede interna)
#   garage   → armazenamento S3 privado (fotos, documentos de KYC, checklists)
# Arrancar:   docker compose --env-file .env up -d --build
name: beeznoo

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      S3_DOMAIN: ${S3_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - garage

  web:
    build:
      context: ../../frontend
      args:
        API_URL: http://api:8080
        STORAGE_PUBLIC_ORIGIN: ${PUBLIC_S3_URL}
        # pré-visualização dos links (og:image absoluto)
        SITE_URL: ${PUBLIC_WEB_URL}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ../../api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SSLMODE: disable
      FRONTEND_URL: ${PUBLIC_WEB_URL}
      GOOGLE_REDIRECT_URI: ${PUBLIC_WEB_URL}/login/oauth2/code/google
      # armazenamento: o mesmo URL público que o browser usa (as URLs assinadas têm de ter este host)
      B2_ENDPOINT: ${PUBLIC_S3_URL}
      B2_REGION: garage
      B2_BUCKET: ${S3_BUCKET}
      B2_ACCESS_KEY: ${S3_ACCESS_KEY}
      B2_SECRET_KEY: ${S3_SECRET_KEY}
      B2_PATH_STYLE: "true"
      SESSION_COOKIE_SECURE: "true"
      # browser → Caddy → Next → API
      RATE_LIMIT_TRUSTED_PROXIES: "2"
      # VPS com 4 GB: mais heap e o compilador C2 (o Dockerfile está afinado para os 512 MB do Render)
      JAVA_OPTS: ${API_JAVA_OPTS:--XX:MaxRAMPercentage=50 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError}
    extra_hosts:
      # a API chega ao armazenamento pelo URL público sem sair do servidor
      - "${S3_DOMAIN_HOST}:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v1.1.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  garage_meta:
  garage_data:
